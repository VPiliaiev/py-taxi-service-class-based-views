{% extends "base.html" %}

{% block content %}
  <h1> Car List </h1>
  <ul>
  {% if car_list %}
    {% for car in car_list %}
  <li><a href="{{ car.get_absolute_url }}">{{ car.model }} ({{ car.manufacturer }}, {{ car.drivers }})</a></li>
    {% endfor %}
    {% else %}
    <p>There are no car in cars</p>
  {% endif %}
  </ul>
{% endblock %}
