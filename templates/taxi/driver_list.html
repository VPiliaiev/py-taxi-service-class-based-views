{% extends "base.html" %}

{% block content %}
  <h1> Driver List </h1>
  <ul>
    {% if driver_list %}
      {% for driver in driver_list %}
        <li><a href="{{ driver.get_absolute_url }}">{{ driver.first_name }})</a></li>
      {% endfor %}
    {% else %}
      <p>There are no driver in drivers</p>
    {% endif %}
  </ul>
{% endblock %}
